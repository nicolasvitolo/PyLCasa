function log(msg, cls='') {
  const el = document.getElementById('log');
  el.innerHTML += `<div class="${cls}">${msg}</div>`;
  el.scrollTop = el.scrollHeight;
}

window.onload = () => {
  const check = setInterval(() => {
    if(window.google && google.accounts) {
      clearInterval(check);
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID, scope: SCOPE,
        callback: async (resp) => {
          if(resp.error) { log('Error de auth: ' + resp.error, 'err'); return; }
          accessToken = resp.access_token;
          await runLoader();
        }
      });
    }
  }, 200);
};

function start() {
  document.getElementById('start-btn').disabled = true;
  tokenClient.requestAccessToken({ prompt: 'consent' });
}

async function sheetsReq(method, endpoint, body) {
  const r = await fetch(`https://sheets.googleapis.com/v4/spreadsheets/${SHEET_ID}${endpoint}`, {
    method,
    headers: { 'Authorization': 'Bearer ' + accessToken, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined
  });
  if(!r.ok) throw new Error(await r.text());
  return r.json();
}

async function runLoader() {
  log('Conectando con Google Sheets...', 'info');

  // Ensure sheet exists with header
  try {
    const meta = await sheetsReq('GET', '');
    const exists = meta.sheets.some(s => s.properties.title === SHEET_NAME);
    if(!exists) {
      await sheetsReq('POST', ':batchUpdate', { requests: [{ addSheet: { properties: { title: SHEET_NAME } } }] });
      log('Pestaña "Transacciones" creada ✓', 'ok');
    } else {
      log('Pestaña "Transacciones" encontrada ✓', 'ok');
    }
    // Set header
    await sheetsReq('PUT', `/values/${SHEET_NAME}!A1:I1?valueInputOption=RAW`, {
      values: [['ID','Fecha','Tipo','Categoría','Subcategoría','Moneda','Monto','Descripción','Cargado por']]
    });
    log('Encabezados configurados ✓', 'ok');
  } catch(e) {
    log('Error configurando sheet: ' + e.message, 'err');
    return;
  }

  // Load in batches of 50
  const BATCH = 50;
  let loaded = 0;
  log(`Cargando ${HIST_ROWS.length} registros en lotes de ${BATCH}...`, 'info');

  for(let i = 0; i < HIST_ROWS.length; i += BATCH) {
    const batch = HIST_ROWS.slice(i, i + BATCH);
    try {
      await sheetsReq('POST', `/values/${SHEET_NAME}!A:I:append?valueInputOption=RAW&insertDataOption=INSERT_ROWS`, {
        values: batch
      });
      loaded += batch.length;
      log(`✓ ${loaded} / ${HIST_ROWS.length} registros cargados`, 'ok');
      await new Promise(r => setTimeout(r, 300)); // rate limit pause
    } catch(e) {
      log(`Error en lote ${i}-${i+BATCH}: ${e.message}`, 'err');
      await new Promise(r => setTimeout(r, 1000));
    }
  }

  log(`<br><strong style="color:#c8f064">✓ LISTO — ${loaded} registros cargados en el Sheet.</strong>`, 'ok');
  log('Ya podés cerrar esta página y abrir la app.', 'info');
}
